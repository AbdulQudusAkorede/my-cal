<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #222;
        }

        #number {
            width: 300px;
            background: black;
            padding: 15px;
            border-radius: 20px;
        }

        #display {
            background: black;
            color: white;
            border: none;
            box-shadow: none;
            font-size: 40px;
            height: 80px;
        }

        #another {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        #another button {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: none;
            font-size: 20px;
        }

        .symbol {
            background: #fb9702;
            font-weight: 800;
        }

        .clear {
            background: #A5A5A5;  
            font-weight: 500;
        }

        .digit {
            background: #333;  
            font-weight: 600;
        }

        #another .zero{
            width: 118px;
            grid-column: span 2;
            border-radius: 30px;
            padding-left: 20px;
            background: #333;

        }

        
    </style>
</head>

<body>

    <div class="container d-flex justify-content-center align-items-center vh-100">

        <div id="number">

            <input type="text" disabled id="display"
                   class="form-control text-end mb-3 text-white" value="">

            <div id="another">

                <button onclick="reset()" class="clear text-dark">AC</button>
                <button onclick="backspace()" class="clear text-dark">
                    <i class="bi bi-backspace"></i>
                </button>
                <button onclick="percent()" class="clear text-dark">%</button>
                <button onclick="show('/')" class="symbol text-white">÷</button>

                <button onclick="show('7')" class="digit text-white">7</button>
                <button onclick="show('8')" class="digit text-white">8</button>
                <button onclick="show('9')" class="digit text-white">9</button>
                <button onclick="show('*')" class="symbol text-white">×</button>

                <button onclick="show('4')" class="digit text-white">4</button>
                <button onclick="show('5')" class="digit text-white">5</button>
                <button onclick="show('6')" class="digit text-white">6</button>
                <button onclick="show('-')" class="symbol text-white">−</button>
 
                <button onclick="show('1')" class="digit text-white">1</button>
                <button onclick="show('2')" class="digit text-white">2</button>
                <button onclick="show('3')" class="digit text-white">3</button>
                <button onclick="show('+')" class="symbol text-white">+</button>

                <button onclick="show('0')" class="zero text-white text-start" >0</button>
                <button onclick="show('.')" class="digit text-white ">.</button>
                <button onclick="calculate()" class="symbol text-white">=</button>

            </div>

        </div>

    </div>

    <script>
        function show(num) {
            console.log(num);
            display.value += num;
        }

        function calculate() {
            let toCalc = document.getElementById("display").value;
            let answer = eval(toCalc);
            document.getElementById("display").value = answer;
        }

        function reset() {
            display.value = "";
        }

        function backspace() {
            let display = document.getElementById("display");
            display.value = display.value.slice(0, -1);
        }

        function percent() {
            display.value = (display.value) / 100;
        }
    </script>

</body>
</html>
